name: Build FixaPro Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name FixaPro_Android_Toolkit app.py

      - name: Download Android Platform Tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath .

      - name: Package toolkit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path FixaPro-Android-Toolkit | Out-Null
          Copy-Item dist/FixaPro_Android_Toolkit.exe FixaPro-Android-Toolkit/
          Copy-Item platform-tools FixaPro-Android-Toolkit/ -Recurse
          if (Test-Path Run_FixaPro.bat) { Copy-Item Run_FixaPro.bat FixaPro-Android-Toolkit/ }
          if (Test-Path README.txt) { Copy-Item README.txt FixaPro-Android-Toolkit/ }
          Compress-Archive -Path FixaPro-Android-Toolkit -DestinationPath FixaPro-Android-Toolkit-Windows.zip -Force

      - name: Upload Windows toolkit
        uses: actions/upload-artifact@v4
        with:
          name: FixaPro-Android-Toolkit-Windows
          path: FixaPro-Android-Toolkit-Windows.zip
